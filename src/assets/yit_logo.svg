<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8862E" />
      <stop offset="100%" stop-color="#B85C1A" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4751C" />
      <stop offset="100%" stop-color="#A0510E" />
    </linearGradient>
    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C46A18" />
      <stop offset="50%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#A0510E" />
    </linearGradient>
    <filter id="pillarGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pillar/Column Icon - 5 vertical bars representing the architectural pillar -->
  <g transform="translate(4, 5)" filter="url(#pillarGlow)">
    <!-- Top cap -->
    <rect x="2" y="0" width="48" height="5" rx="1.5" fill="url(#pillarGrad)" />

    <!-- 5 Pillar bars -->
    <rect x="5" y="8" width="6" height="42" rx="1" fill="url(#pillarGrad)" opacity="0.95" />
    <rect x="14" y="8" width="6" height="42" rx="1" fill="url(#pillarGrad)" opacity="0.90" />
    <rect x="23" y="8" width="6" height="42" rx="1" fill="url(#pillarGrad)" opacity="0.85" />
    <rect x="32" y="8" width="6" height="42" rx="1" fill="url(#pillarGrad)" opacity="0.90" />
    <rect x="41" y="8" width="6" height="42" rx="1" fill="url(#pillarGrad)" opacity="0.95" />

    <!-- Bottom base -->
    <rect x="2" y="53" width="48" height="5" rx="1.5" fill="url(#pillarGrad)" />
  </g>

  <!-- YENEPOYA text -->
  <text
    x="68"
    y="30"
    fill="url(#textGrad)"
    style="font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 0.08em;"
  >
    YENEPOYA
  </text>

  <!-- INSTITUTE OF TECHNOLOGY text -->
  <text
    x="68"
    y="52"
    fill="url(#subtextGrad)"
    style="font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.15em;"
  >
    INSTITUTE OF TECHNOLOGY
  </text>
</svg>
