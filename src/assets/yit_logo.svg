<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" className="h-full w-auto">
  <defs>
    <linearGradient id="yitCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="yitGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c8e6ff" />
    </linearGradient>
    <filter id="yitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Authentic YIT Crest & Emblem Insignia -->
  <g transform="translate(4, 3)">
    <!-- Outer Shield / Hex Badge -->
    <path
      d="M25 1 L47 13 L47 37 L25 49 L3 37 L3 13 Z"
      fill="rgba(0, 240, 255, 0.06)"
      stroke="url(#yitCyanGrad)"
      stroke-width="1.75"
      stroke-linejoin="round"
    />
    <path
      d="M25 5 L43 15 L43 35 L25 45 L7 15 Z"
      fill="none"
      stroke="rgba(0, 240, 255, 0.25)"
      stroke-width="1"
      stroke-dasharray="2 2"
    />

    <!-- Stylized 'Y' Tree / Rising Flame of Knowledge -->
    <!-- Left Leaf / Wing -->
    <path
      d="M14 18 C18 20, 22 26, 25 33 C23 26, 21 21, 16 16 Z"
      fill="#00f0ff"
      opacity="0.9"
    />
    <!-- Right Leaf / Wing -->
    <path
      d="M36 18 C32 20, 28 26, 25 33 C27 26, 29 21, 34 16 Z"
      fill="#00c8ff"
      opacity="0.9"
    />
    <!-- Central Rising Flame / Core of Y -->
    <path
      d="M25 12 C26.5 16, 28 20, 25 27 C22 20, 23.5 16, 25 12 Z"
      fill="#ffffff"
    />
    <circle cx="25" cy="11" r="2" fill="#00f0ff" filter="url(#yitGlow)" />

    <!-- Open Book Base of Education -->
    <path
      d="M13 36 C19 33, 23 35, 25 38 C27 35, 31 33, 37 36 L36 39 C31 36, 27 38, 25 41 C23 38, 19 36, 14 39 Z"
      fill="url(#yitCyanGrad)"
    />

    <!-- Stem of the Y -->
    <path
      d="M24 33 L26 33 L26 43 L24 43 Z"
      fill="#ffffff"
      opacity="0.85"
    />
  </g>

  <!-- 2. Wordmark Typography -->
  <g transform="translate(62, 0)">
    <!-- YENEPOYA -->
    <text
      x="0"
      y="22"
      fill="url(#yitGoldGrad)"
      style="font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 900; letter-spacing: 0.12em;"
    >
      YENEPOYA
    </text>

    <!-- INSTITUTE OF TECHNOLOGY -->
    <text
      x="0"
      y="36"
      fill="#00f0ff"
      style="font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;"
    >
      INSTITUTE OF TECHNOLOGY
    </text>

    <!-- Accreditation / Location sub-line -->
    <text
      x="0"
      y="47"
      fill="rgba(255, 255, 255, 0.45)"
      style="font-family: 'Inter', monospace, sans-serif; font-size: 7px; font-weight: 600; letter-spacing: 0.18em;"
    >
      MOODBIDRI · MANGALORE
    </text>
  </g>
</svg>
